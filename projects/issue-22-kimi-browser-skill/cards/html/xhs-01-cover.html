<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>重复点网页的活，让Kimi学一次</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1440px; }
    body {
      position: relative;
      background: #211e1b;
      color: #faf4e9;
      font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { padding: 278px 84px 0; }
    .label {
      display: inline-block;
      margin: 0 0 54px;
      padding: 11px 22px 12px;
      border: 2px solid #ee3f5e;
      border-radius: 13px;
      color: #ff6b83;
      font-size: 29px;
      font-weight: 600;
      letter-spacing: 3px;
      line-height: 1.4;
    }
    h1 { margin: 0; font-weight: 800; }
    h1 span { display: block; }
    .lead { margin-bottom: 14px; font-size: 91px; line-height: 1.35; letter-spacing: -2px; }
    .hero { font-size: 151px; line-height: 1.2; letter-spacing: -3px; }
    .hero strong { color: #ff355c; font-weight: inherit; }
    .description { margin: 48px 0 0; color: #c9c1b7; font-size: 41px; line-height: 1.65; font-weight: 400; }
    footer { position: absolute; left: 84px; bottom: 68px; color: #b6aba0; font-size: 28px; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <p class="label">AI 工具用法</p>
    <h1>
      <span class="lead">重复点网页的活</span>
      <span class="hero">让 <strong>Kimi</strong></span>
      <span class="hero">学一次</span>
    </h1>
    <p class="description">录下步骤，保存成技能<br>下次遇到同类任务继续用</p>
  </main>
  <footer>Kimi 浏览器扩展</footer>
</body>
</html>
